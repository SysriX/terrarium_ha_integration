<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium card test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root { --primary-background-color:#111315; --card-background-color:#1c1e21; --secondary-background-color:#25282c; --primary-text-color:#e6e6e6;
    --secondary-text-color:#9aa0a6; --divider-color:#33373c; --primary-color:#03a9f4; --app-header-background-color:#1c1e21; }
  body { margin:0; background: var(--primary-background-color); font-family: Roboto, "Segoe UI", sans-serif; }
  #host { max-width: 1400px; margin: 0 auto; }
</style>
</head>
<body>
<div id="host"></div>
<script>
// minimal ha-icon / ha-menu-button / ha-card stand-ins for the test page
customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this.r(); } attributeChangedCallback() { this.r(); }
  r() { if (!this.shadowRoot) this.attachShadow({ mode: "open" });
    const n = (this.getAttribute("icon") || "").replace("mdi:", "");
    this.shadowRoot.innerHTML = `<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"><style>:host{display:inline-flex;vertical-align:middle}i{font-size:var(--mdc-icon-size,20px);line-height:1}</style><i class="mdi mdi-${n}"></i>`; }
});
customElements.define("ha-menu-button", class extends HTMLElement { connectedCallback() { this.innerHTML = `<ha-icon icon="mdi:menu" style="padding:8px"></ha-icon>`; } });
customElements.define("ha-card", class extends HTMLElement { connectedCallback() { this.style.display = "block"; this.style.background = "var(--card-background-color)"; this.style.borderRadius = "12px"; } });
</script>
<script src="../custom_components/terrarium/frontend/terrarium-card.js"></script>
<script>
const P = new URLSearchParams(location.search);
const states = {};
const st = (id, state, attrs) => { states[id] = { entity_id: id, state: String(state), attributes: attrs }; };
st("sensor.rack_top_temperature", 27.4, { friendly_name: "Rack top temperature", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.rack_top_humidity", 52, { friendly_name: "Rack top humidity", unit_of_measurement: "%", device_class: "humidity" });
st("sensor.gecko_warm_temperature", 30.8, { friendly_name: "Gecko warm side", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.gecko_cold_temperature", 25.2, { friendly_name: "Gecko cold side", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.gecko_humidity", 41, { friendly_name: "Gecko humidity", unit_of_measurement: "%", device_class: "humidity" });
st("sensor.crested_temperature", 24.1, { friendly_name: "Crested gecko temperature", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.crested_humidity", 63, { friendly_name: "Crested gecko humidity", unit_of_measurement: "%", device_class: "humidity" });
st("sensor.frogs_temperature", 23.6, { friendly_name: "Dart frogs temperature", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.frogs_humidity", 78, { friendly_name: "Dart frogs humidity", unit_of_measurement: "%", device_class: "humidity" });
st("sensor.dragon_temperature", 38.9, { friendly_name: "Bearded dragon temperature", unit_of_measurement: "°C", device_class: "temperature" });
st("sensor.dragon_humidity", 31, { friendly_name: "Bearded dragon humidity", unit_of_measurement: "%", device_class: "humidity" });
st("light.gecko_led", "on", { friendly_name: "Gecko LED" });
st("switch.gecko_heat_mat", "on", { friendly_name: "Heat mat" });
st("light.frogs_led", "on", { friendly_name: "Frogs LED" });
st("switch.frogs_rain", "on", { friendly_name: "Rain system" });
st("fan.frogs_fan", "off", { friendly_name: "Frogs fan" });
st("light.dragon_uv", "on", { friendly_name: "UV lamp" });
st("notify.mobile_app_phone", "unknown", { friendly_name: "Phone" });

const clim = (ts, hs, tmin, tmax, hmin, hmax) => ({ temp_sensors: ts, hum_sensors: hs, temp_min: tmin, temp_max: tmax, hum_min: hmin, hum_max: hmax,
  night: { enabled: true, start: "21:00", end: "07:00", temp_min: tmin - 4, temp_max: null, hum_min: null, hum_max: null }, delay: 10, temp_hyst: 0.5, hum_hyst: 3 });
const notify = { enabled: true, targets: ["notify.mobile_app_phone"], clear: true, offline: true, repeat: 0, persistent: false };
const mk = (id, nr, name, animal, x, y, w, h, c, look, devices, live) => ({ id, nr, name, animal, x, y, width: w, height: h, depth: 50, climate: c, notify, devices, look,
  light: {}, ventilation: {}, rain: {}, label: "", live, entities: { temperature: `sensor.terrarium_${id}_temperature`, humidity: `sensor.terrarium_${id}_humidity` } });
const live = (t, h, status, problems = [], pending = [], devices = [], tg = {}) => ({ temperature: t, humidity: h, status, problems, pending, period: "day",
  since: Object.fromEntries([...problems, ...pending].map((p) => [p, new Date(Date.now() - 42 * 60000).toISOString()])), targets: tg,
  temp_sensors: [], hum_sensors: [], devices });
const data = { enclosures: [
  { id: "e1", nr: 1, name: "Living room rack", width: 120, height: 180, depth: 50, color: "wood", compartments: [
    mk("c1", 1, "Corn snake", "Pantherophis guttatus", 0, 0, 120, 58, clim(["sensor.rack_top_temperature"], ["sensor.rack_top_humidity"], 24, 30, 40, 65),
      { substrate: "bark", decor: "branches", background: "cork" }, [],
      live(27.4, 52, "ok", [], [], [], { temp_min: 24, temp_max: 30, hum_min: 40, hum_max: 65 })),
    mk("c2", 2, "Leopard gecko", "Eublepharis macularius", 0, 61, 58.5, 56, clim(["sensor.gecko_warm_temperature", "sensor.gecko_cold_temperature"], ["sensor.gecko_humidity"], 25, 32, 30, 50),
      { substrate: "sand", decor: "stones", background: "rock" },
      [{ entity_id: "light.gecko_led", kind: "light", name: "" }, { entity_id: "switch.gecko_heat_mat", kind: "heat", name: "" }],
      live(28.0, 41, "ok", [], [], [{ entity_id: "light.gecko_led", kind: "light", state: "on" }, { entity_id: "switch.gecko_heat_mat", kind: "heat", state: "on" }], { temp_min: 25, temp_max: 32, hum_min: 30, hum_max: 50 })),
    mk("c3", 3, "Crested gecko", "Correlophus ciliatus", 61.5, 61, 58.5, 56, clim(["sensor.crested_temperature"], ["sensor.crested_humidity"], 22, 27, 65, 85),
      { substrate: "soil", decor: "mixed", background: "cork" }, [],
      live(24.1, 63, "pending", [], ["hum_low"], [], { temp_min: 22, temp_max: 27, hum_min: 65, hum_max: 85 })),
    mk("c4", 4, "Dart frogs", "Dendrobates tinctorius", 0, 120, 120, 60, clim(["sensor.frogs_temperature"], ["sensor.frogs_humidity"], 21, 27, 70, 100),
      { substrate: "water", decor: "plants", background: "jungle" },
      [{ entity_id: "light.frogs_led", kind: "light", name: "" }, { entity_id: "switch.frogs_rain", kind: "rain", name: "" }, { entity_id: "fan.frogs_fan", kind: "ventilation", name: "" }],
      live(23.6, 78, "ok", [], [], [{ entity_id: "light.frogs_led", kind: "light", state: "on" }, { entity_id: "switch.frogs_rain", kind: "rain", state: "on" }], { temp_min: 21, temp_max: 27, hum_min: 70, hum_max: 100 })),
  ] },
  { id: "e2", nr: 2, name: "Office", width: 100, height: 60, depth: 50, color: "black", compartments: [
    mk("c5", 1, "Bearded dragon", "Pogona vitticeps", 0, 0, 100, 60, clim(["sensor.dragon_temperature"], ["sensor.dragon_humidity"], 26, 36, 25, 45),
      { substrate: "sand", decor: "branches", background: "rock" }, [{ entity_id: "light.dragon_uv", kind: "uv", name: "" }],
      live(38.9, 31, "alarm", ["temp_high"], [], [{ entity_id: "light.dragon_uv", kind: "uv", state: "on" }], { temp_min: 26, temp_max: 36, hum_min: 25, hum_max: 45 })),
  ] },
] };
for (const e of data.enclosures) for (const c of e.compartments) { c.label = `${e.nr}.${c.nr}`; c.live.devices = c.devices.map((d) => ({ ...d, state: states[d.entity_id]?.state ?? null })); }
data.enclosures[0].compartments[1].live.temp_sensors = [{ entity_id: "sensor.gecko_warm_temperature", name: "Gecko warm side", value: 30.8 }, { entity_id: "sensor.gecko_cold_temperature", name: "Gecko cold side", value: 25.2 }];
data.enclosures[0].compartments[1].live.hum_sensors = [{ entity_id: "sensor.gecko_humidity", name: "Gecko humidity", value: 41 }];

// ---- automation demo data (1.2)
st("switch.gecko_hid", "on", { friendly_name: "Gecko HID 70 W" });
st("switch.gecko_moon", "off", { friendly_name: "Gecko moon LED" });
st("switch.rack_rain", "off", { friendly_name: "Rack rain pump" });
st("switch.dragon_hid", "on", { friendly_name: "Dragon HID 150 W" });
data.light_types = [
  { id: "led", name: "LED Ausleuchtung", category: "led", watt: 20, restrike_min: 0, color: "#fff6e0" },
  { id: "hid70", name: "HID 70 W", category: "hid", watt: 70, restrike_min: 10, color: "#ffe9b0" },
  { id: "hid150", name: "HID 150 W", category: "hid", watt: 150, restrike_min: 10, color: "#ffe9b0" },
  { id: "pl", name: "P&L Leuchte (Pflanzen)", category: "pl", watt: 30, restrike_min: 0, color: "#f3e8ff" },
  { id: "ph_led", name: "Power & Heat LED", category: "ph", watt: 25, restrike_min: 0, color: "#ffd99a" },
  { id: "night", name: "Nacht-LED (Mondlicht)", category: "night", watt: 2, restrike_min: 0, color: "#7fa8ff" },
];
const TT = (s) => ({ type: "time", time: s, offset: 0 });
const prof = (name, on, off, extra = {}) => ({ id: name, name, enabled: true, days: [], season: { enabled: false, from: "03-01", to: "10-31" }, windows: [{ on: TT(on), off: TT(off) }], runs: [], ...extra });
const today = (h, m = 0) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); };
const lightsGecko = [
  { id: "l1", name: "", type_id: "led", entity_id: "light.gecko_led", enabled: true, overheat: { enabled: false, above: 40, hyst: 2 }, profiles: [prof("Summer", "08:00", "20:00", { season: { enabled: true, from: "04-01", to: "09-30" } }), prof("Winter", "09:00", "18:00", { season: { enabled: true, from: "10-01", to: "03-31" } })] },
  { id: "l2", name: "Basking spot", type_id: "hid70", entity_id: "switch.gecko_hid", enabled: true, overheat: { enabled: true, above: 38, hyst: 2 }, profiles: [prof("Day", "10:00", "16:00")] },
  { id: "l3", name: "", type_id: "night", entity_id: "switch.gecko_moon", enabled: true, overheat: { enabled: false, above: 40, hyst: 2 }, profiles: [prof("Moon", "20:00", "23:00", { days: [4, 5] })] },
];
const rainShared = { entity_id: "switch.rack_rain", enabled: true, manual_duration: 30, max_duration: 600, min_pause: 0,
  profiles: [{ id: "r1", name: "Daily", enabled: true, days: [], season: { enabled: false, from: "03-01", to: "10-31" }, windows: [], runs: [{ at: TT("08:00"), duration: 45 }, { at: TT("14:00"), duration: 30 }, { at: TT("19:30"), duration: 30 }] }],
  hum_start: { enabled: true, below: 60, duration: 30, min_pause: 120 }, hum_block: { enabled: true, above: 92 } };
const vent = { entity_id: "fan.frogs_fan", enabled: true, min_run: 5, profiles: [{ id: "v1", name: "Fresh air", enabled: true, days: [], season: { enabled: false, from: "03-01", to: "10-31" }, windows: [], runs: [{ at: TT("12:00"), duration: 600 }] }],
  temp_on: { enabled: true, above: 28, hyst: 1 }, hum_on: { enabled: true, above: 95, hyst: 5 } };
for (const e of data.enclosures) for (const c of e.compartments) {
  c.lights = []; c.light_auto = true; c.rain = { entity_id: "", enabled: true, profiles: [], manual_duration: 30, max_duration: 600, min_pause: 0, hum_start: { enabled: false, below: 60, duration: 30, min_pause: 60 }, hum_block: { enabled: false, above: 90 } };
  c.vent = { entity_id: "", enabled: true, profiles: [], min_run: 5, temp_on: { enabled: false, above: 32, hyst: 1 }, hum_on: { enabled: false, above: 90, hyst: 5 } };
  c.groups = {}; c.auto = {}; c.entities.cfg_light_auto = "switch.terrarium_x_cfg_light_auto";
}
const C = (id) => data.enclosures.flatMap((e) => e.compartments).find((c) => c.id === id);
const g = C("c2"); g.lights = lightsGecko;
g.auto.light = { auto: true, lights: [
  { id: "l1", name: "LED Ausleuchtung", category: "led", color: "#fff6e0", entity_id: "light.gecko_led", state: "on", auto: true, next: today(18), reason: "Schedule" },
  { id: "l2", name: "Basking spot", category: "hid", color: "#ffe9b0", entity_id: "switch.gecko_hid", state: "on", auto: true, next: today(16), reason: "Schedule" },
  { id: "l3", name: "Nacht-LED (Mondlicht)", category: "night", color: "#7fa8ff", entity_id: "switch.gecko_moon", state: "off", auto: true, next: today(20) },
] };
for (const id of ["c2", "c3"]) { const c = C(id); c.rain = clone2(rainShared); c.groups.rain = { id: "g1", name: "Middle row", members: ["1.2", "1.3"] };
  c.auto.rain = { configured: true, auto: true, entity_id: "switch.rack_rain", state: "off", running_until: null, next_run: today(19, 30), next_duration: 30, last_run: today(14), blocked: false, manual_duration: 30 }; }
const f = C("c4"); f.vent = vent; f.auto.vent = { configured: true, auto: true, entity_id: "fan.frogs_fan", state: "off", desired: false, reason: "off", next: today(23, 59) };
f.lights = [{ id: "l9", name: "", type_id: "pl", entity_id: "light.frogs_led", enabled: true, overheat: { enabled: false, above: 40, hyst: 2 }, profiles: [prof("Rainforest", "07:30", "19:30")] }];
f.auto.light = { auto: true, lights: [{ id: "l9", name: "P&L Leuchte (Pflanzen)", category: "pl", color: "#f3e8ff", entity_id: "light.frogs_led", state: "on", auto: true, next: today(19, 30) }] };
const dgn = C("c5"); dgn.lights = [{ id: "l7", name: "", type_id: "hid150", entity_id: "switch.dragon_hid", enabled: true, overheat: { enabled: true, above: 42, hyst: 2 }, profiles: [prof("Day", "08:00", "19:00")] }];
dgn.auto.light = { auto: true, lights: [{ id: "l7", name: "HID 150 W", category: "hid", color: "#ffe9b0", entity_id: "switch.dragon_hid", state: "on", auto: true, next: today(19), reason: "Schedule" }] };
data.groups = [{ id: "g1", kind: "rain", name: "Middle row", members: ["c2", "c3"], member_labels: ["1.2", "1.3"], config: { rain: rainShared } }];
data.templates = [
  { id: "t1", kind: "light", name: "Desert (LED + HID)", default_new: true, config: { light_auto: true, lights: [lightsGecko[0], lightsGecko[1]].map((l) => ({ ...l, entity_id: "" })) } },
  { id: "t2", kind: "rain", name: "Rainforest 3× daily", default_new: false, config: { rain: { ...rainShared, entity_id: "" } } },
];
data.db = { status: "ok", error: "", url: "mysql://terrarium:***@192.0.2.10/terrarium" };
function clone2(o) { return JSON.parse(JSON.stringify(o)); }
let subCb = null;
const hist = (base, amp, noise) => { const out = []; const now = Date.now() / 1000; for (let i = 0; i <= 288; i++) { const t = now - 86400 + i * 300; const hr = new Date(t * 1000).getHours() + new Date(t * 1000).getMinutes() / 60; out.push({ s: (base + amp * Math.sin((hr - 9) / 24 * 2 * Math.PI) + (Math.random() - 0.5) * noise).toFixed(2), lu: t }); } return out; };
const hass = {
  language: P.get("lang") || "en", locale: { language: P.get("lang") || "en" }, user: { is_admin: true }, states,
  connection: { subscribeMessage: (cb) => { subCb = cb; setTimeout(() => cb(data), 10); return Promise.resolve(() => {}); } },
  callService: (d, s, dt) => { const e = states[dt.entity_id]; if (e) e.state = e.state === "on" ? "off" : "on"; for (const en of data.enclosures) for (const c of en.compartments) for (const dv of c.live.devices) if (dv.entity_id === dt.entity_id) dv.state = e.state; subCb && subCb(data); },
  callWS: async (m) => {
    if (m.type === "terrarium/notify_targets") return { targets: [{ id: "notify.mobile_app_phone", name: "Phone", type: "service" }] };
    if (m.type === "history/history_during_period") { const out = {}; for (const id of m.entity_ids) out[id] = id.endsWith("temperature") ? hist(27, 3, 0.4) : hist(55, 10, 2); return out; }
    if (m.type === "terrarium/save_enclosure") { console.log("save_enclosure", m.enclosure); return { id: "x", reload: true }; }
    if (m.type === "terrarium/save_compartment") { console.log("save_compartment", m); return null; }
    if (m.type === "terrarium/test_notify") return { failed: [] };
    if (m.type === "terrarium/events") return { events: [
      { ts: new Date(Date.now() - 20 * 60000).toISOString(), unit: "Middle row", kind: "rain", entity_id: "switch.rack_rain", action: "off", reason: "Run finished" },
      { ts: new Date(Date.now() - 21 * 60000).toISOString(), unit: "Middle row", kind: "rain", entity_id: "switch.rack_rain", action: "on", reason: "Schedule Daily (30 s)" },
      { ts: new Date(Date.now() - 95 * 60000).toISOString(), unit: "1.2", kind: "light", entity_id: "switch.gecko_hid", action: "on", reason: "Schedule" },
      { ts: new Date(Date.now() - 300 * 60000).toISOString(), unit: "1.2", kind: "light", entity_id: "light.gecko_led", action: "on", reason: "Schedule" } ] };
    if (m.type === "terrarium/rain") { console.log("rain", m); return {}; }
    if (m.type && m.type.startsWith("terrarium/")) { console.log(m.type, m); return { id: "x" }; }
    return null;
  },
};
const mode = P.get("mode") || "panel";
const el = document.createElement(mode === "card" ? "terrarium-card" : "terrarium-panel");
if (mode === "card") el.setConfig({});
el.panel = { title: "Terrariums" };
el.hass = hass;
document.getElementById("host").appendChild(el);
const view = P.get("view");
setTimeout(() => {
  if (view === "details") { el._view = { name: "details", comp: P.get("comp") || "c4" }; el._render(); }
  if (view === "settings") el._openCompSettings(P.get("comp") || "c2", P.get("tab") || "general");
  if (view === "ltypes" || view === "tpls" || view === "groups") { el._view = { name: view }; el._render(); }
  if (view === "tpl") { el._view = { name: "tpl", draft: JSON.parse(JSON.stringify(data.templates[0])) }; el._render(); }
  if (view === "editor") { el._openEncEditor("e1"); el._view.sel = "c3"; el._render(); }
}, 60);
</script>
</body>
</html>
